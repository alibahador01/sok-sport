<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Şok Sport⁰¹ — نتایج زنده</title>
<meta name="theme-color" content="#0d1117">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: { blue: '#3b82f6', purple: '#7c3aed', red: '#ef4444', green: '#22c55e' }
      }
    }
  }
};
</script>
</head>
<body class="bg-[#0d1117] text-[#e6edf3] min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-50 bg-[#0d1117]/95 backdrop-blur border-b border-[#21262d]">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <div class="flex items-center gap-2">
      <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center font-black text-white text-lg">Ş</span>
      <span class="text-base font-medium">Şok<span class="font-extrabold text-blue-500">Sport</span><sup class="text-[9px] text-gray-500">⁰¹</sup></span>
    </div>
    <div class="flex-1"></div>
    <button id="refresh-btn" class="px-3 h-8 rounded-lg bg-[#161b22] border border-[#21262d] text-xs font-semibold hover:bg-[#21262d]">به‌روزرسانی</button>
  </div>
</header>

<!-- Main -->
<main class="max-w-6xl mx-auto px-3 py-4">

  <!-- Selectors -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
    <div>
      <label class="block text-xs font-bold text-gray-400 mb-1.5">کشور</label>
      <select id="country-select" class="w-full h-11 bg-[#161b22] border border-[#21262d] rounded-lg px-3 text-sm focus:outline-none focus:border-blue-500">
        <option value="">در حال بارگذاری...</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-400 mb-1.5">لیگ</label>
      <select id="league-select" class="w-full h-11 bg-[#161b22] border border-[#21262d] rounded-lg px-3 text-sm focus:outline-none focus:border-blue-500">
        <option value="">ابتدا کشور رو انتخاب کن</option>
      </select>
    </div>
  </div>

  <!-- Date nav -->
  <div class="flex items-center gap-2 mb-4 bg-[#161b22] border border-[#21262d] rounded-lg p-1.5">
    <button id="prev-day" class="w-9 h-9 rounded-md hover:bg-[#21262d] flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="date-label" class="flex-1 text-center font-bold text-sm">امروز</div>
    <button id="next-day" class="w-9 h-9 rounded-md hover:bg-[#21262d] flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <!-- Matches -->
  <div id="matches" class="space-y-2">
    <div class="text-center py-12 text-gray-500 text-sm">لیگ رو انتخاب کن تا بازی‌ها بیاد</div>
  </div>

</main>

<footer class="border-t border-[#21262d] mt-8 py-6 text-center text-xs text-gray-500">
  © 2025 Şok Sport<sup>⁰¹</sup>
</footer>

<script src="app.js"></script>
</body>
        </html>
